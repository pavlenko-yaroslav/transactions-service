server:
  port: 8081

spring:
  application:
    name: transactions-service

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/transactions}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    # Flyway owns the schema, Hibernate only validates it.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cassandra:
    keyspace-name: ${CASSANDRA_KEYSPACE:transactions}
    contact-points: ${CASSANDRA_CONTACT_POINTS:127.0.0.1}
    port: ${CASSANDRA_PORT:9042}
    local-datacenter: ${CASSANDRA_DATACENTER:datacenter1}
    schema-action: create_if_not_exists
    request:
      timeout: 10s
    connection:
      init-query-timeout: 20s

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  limit:
    # Applies when a client has never established a limit.
    default-sum: 1000.00
    currency: USD
  exchange:
    base-currency: USD
    pairs:
      - EUR/USD
    api-url: https://api.twelvedata.com
    interval: 1day
    api-key: ${TWELVEDATA_API_KEY:}
    fetch-enabled: ${EXCHANGE_FETCH_ENABLED:true}
    cron: "0 0 0 * * *"
    # Demo rates, written at startup only into pairs that hold no data yet, so the service
    # can be started and exercised without a provider key. Leave empty in production.
    seed-rates:
      EUR/USD: ${SEED_RATE_EUR_USD:1.0850}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    ru.yaroslav_pavlenko.TransactionsRestApi: INFO
